# Ploopi — déploiement Docker en trois commandes.
# Voir docker/LISEZMOI.md pour le guide pas à pas (pour débutants).
#
#   docker compose up --build -d   → démarre Ploopi + la base
#   http://localhost:8080/        → assistant d'installation
#   docker compose down           → arrête tout
#
# Version de PHP (8.5 par défaut) : PHP_VERSION=8.2 docker compose up --build -d
# ou une ligne « PHP_VERSION=8.2 » dans un fichier .env à côté de ce fichier.

services:
  # ————————————————— Base de données —————————————————
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ploopi
      MARIADB_USER: ploopi
      MARIADB_PASSWORD: ploopi_motdepasse   # à changer !
      MARIADB_ROOT_PASSWORD: root_motdepasse # à changer !
    volumes:
      - donnees_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ————————————————— Application Ploopi —————————————————
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    # une image par version : passer de l'une à l'autre ne recompile rien
    image: ploopi-web:php${PHP_VERSION:-8.5}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"                     # Ploopi sera sur http://localhost:8080
    environment:
      PLOOPI_DB_SERVER: db            # valeur proposée par l'assistant (nom du service ci-dessus)
      # Configuration propre au conteneur, hors du dépôt : le config/config.php d'une
      # installation de Ploopi hors Docker dans le même dossier n'est ni lu ni écrasé.
      PLOOPI_CONFIG: /var/www/ploopi-config/config.php
    volumes:
      - .:/var/www/html               # le dépôt cloné
      # documents déposés, hors de la racine web : l'assistant propose ../ploopi-data.
      # Volume nommé et non dossier du dépôt : le dépôt entier est servi par Apache.
      - documents:/var/www/ploopi-data
      # config.php écrit par l'assistant ; effacé avec la base par « docker compose down -v »
      - configuration:/var/www/ploopi-config

volumes:
  donnees_db:
  documents:
  configuration:
