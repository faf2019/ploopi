; Gabarit ploopi4 : mêmes clés que ploopi3 (lues par la messagerie, les annotations, forms).
; Les couleurs écrites en ligne par ces écrans sont des jetons : elles suivent le thème.
colprim     = "var(--surface)"
colsec      = "var(--surface-2)"
colhover    = #15232a
bgcolor     = #eef2f4
bgline1     = "var(--surface)"
bgline2     = "var(--surface-2)"
img_extension = .png

; Génération du gabarit (ploopi\skin::version) : les écrans refondus de system
; s'affichent à partir de 4, les autres gabarits gardent les écrans historiques
version     = 4

; Icône de chaque type de module dans le menu latéral (glyphes de img/icons.svg)
icon_default     = apps
icon_system      = settings
icon_doc         = folders
icon_webedit     = world-www
icon_forms       = forms
icon_wiki        = book-2
icon_news2       = news
icon_planning    = calendar
icon_booking     = calendar-event
icon_directory   = address-book
icon_dbreport    = chart-bar
icon_nanogallery = photo
