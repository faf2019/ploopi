; Réglages PHP de l'image de production (docker-compose.prod.yml).
; Le code est figé dans l'image : opcache n'a pas à revérifier les fichiers.
; modules/ est un volume réécrit au démarrage, donc avant tout chargement.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

expose_php = Off
display_errors = Off
log_errors = On
session.cookie_secure = 1
session.cookie_httponly = 1
