; Réglages PHP propres à Ploopi (conteneur web DDEV).
; request_order n'est pas à régler : loader::boot() ne garde que GET et POST
; dans $_REQUEST, quelle que soit la configuration de PHP.

; Le socle contient encore des balises courtes « <? » : indispensable.
short_open_tag = On

; L'assistant d'installation et les tests écrivent beaucoup de fichiers.
upload_max_filesize = 32M
post_max_size = 32M
memory_limit = 512M
